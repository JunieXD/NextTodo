[package]
name = "nexttodo-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own: the root one's `cargo test` would build Tauri every time otherwise.
[workspace]

[lib]
name = "nexttodo_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Local mode: the server, inside the app (src/local.rs).
nexttodo-server = { path = "../../../crates/server", features = ["agent-port"] }
# Links from the page, in the default browser or mail app.
open = "5.4.5"
# The TLS crypto the updater's downloads need: its client brings none (src/updates.rs).
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
# `generate_context!` writes the plugins' settings of tauri.conf.json as `serde_json` values.
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
# Where local mode's backups go and come from.
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
# Without the default cookie jar: the app signs in with its token only.
tauri-plugin-http = { version = "2.8.3", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-notification = "2.8.0"
# Started again on Windows, the app shows the window of the one running, as macOS does by itself.
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tracing = "0.1.44"
# The log, the server's and the plugins', on standard error (docs/local.md#可靠性).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Whether the command line is on the user's PATH (src/cli.rs).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

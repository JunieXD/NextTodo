[package]
name = "nexttodo-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "nexttodo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
uuid = { version = "1.29.0", features = ["v7"] }

[lints]
workspace = true

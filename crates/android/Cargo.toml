[package]
name = "nexttodo-android"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Without `regex`: the level is all it filters on.
android_logger = { version = "0.15.1", default-features = false }
anyhow = "1.0.104"
jni = "0.22.4"
log = "0.4.35"
nexttodo-server = { path = "../server" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
# The server's events as `log` records, which android_logger writes to logcat.
tracing = { version = "0.1.44", features = ["log"] }

# The workspace's, but for the entry points: JNI finds them by their unmangled names, which Rust
# counts as unsafe code. Each says so; nothing else may (docs/local.md#android).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

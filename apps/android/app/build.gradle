apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Versions from the commits (docs/android.md#更新): all of them for the version code, which only
// grows, and the version; those that changed the native part for the native version, which a web
// app built since needs at least.
def count = { List<String> paths ->
    providers.exec {
        workingDir rootProject.file('../..')
        commandLine(['git', 'rev-list', '--count', 'HEAD', '--'] + paths)
    }.standardOutput.asText.get().trim().toInteger()
}
def commits = count([])
def rustLibs = layout.buildDirectory.dir('rust')
def nativeVersion = count(['apps/android', 'apps/web/capacitor.config.ts', 'apps/web/package.json'])

android {
    namespace = "cn.juniexd.nexttodo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.juniexd.nexttodo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode commits
        versionName "0.1.$commits"
        buildConfigField "int", "NATIVE", "$nativeVersion"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Self-signed; the keystore and its password stay outside the repository. See docs/android.md.
    signingConfigs {
        release {
            def keystore = System.getenv('NEXTTODO_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('NEXTTODO_KEYSTORE_PASSWORD')
                keyAlias 'nexttodo'
                keyPassword System.getenv('NEXTTODO_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    sourceSets {
        main.jniLibs.srcDir(rustLibs)
    }
}

// Local mode's server (crates/android), for arm64-v8a alone: real devices and the emulators on
// Apple silicon (docs/local.md#android).
tasks.register('rust', Exec) {
    workingDir rootProject.file('../..')
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-o', rustLibs.get().asFile.path, 'build', '--profile', 'android', '-p', 'nexttodo-android'
}
tasks.named('preBuild') { dependsOn 'rust' }

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing is far too slow unoptimized, which would make tests crawl
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The server library in the Android app (docs/local.md#android): small, as it goes in the APK.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

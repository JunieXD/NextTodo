# Runs NextTodo with its database in ./data, which must belong to user 65534, the one the server
# runs as. It listens on 127.0.0.1 only, for a reverse proxy on the same machine that serves HTTPS.
# See docs/deploy.md.
services:
  nexttodo:
    image: ${NEXTTODO_IMAGE:-ghcr.io/juniexd/nexttodo:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXTTODO_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      RUST_LOG: info
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

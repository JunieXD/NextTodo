[package]
name = "nexttodo-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# SQLite conversions for the server
sql = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.41.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

